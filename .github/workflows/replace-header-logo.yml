name: Replace header logo
on:
  push:
    branches: [main]
    paths: ['.github/workflows/replace-header-logo.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy exact SVG and commit
        run: |
          cp 'Pasieka/Sam logotyp/Sam logotyp.svg' 'woocommerce/theme/pasieka-pod-debem/assets/logo.svg'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add woocommerce/theme/pasieka-pod-debem/assets/logo.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Replace header logo with Sam logotyp.svg'
          git push origin HEAD:main
